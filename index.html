html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff;background:radial-gradient(120% 90% at 50% 0%,#1f6f78 0%,#12263a 70%)}

.t{font:inherit;font-size:18px;color:#fff;background:rgba(255,255,255,.16);border:0;border-radius:12px;padding:10px 12px;cursor:pointer}

.tube{width:var(--w);height:calc(var(--s)*4 + 18px);border:3px solid var(--tb,rgba(255,255,255,.75));border-top:none;border-radius:4px 4px calc(var(--w)/2) calc(var(--w)/2);background:var(--tbg,rgba(255,255,255,.1));display:flex;flex-direction:column-reverse;padding:3px;gap:2px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.tube.sel{transform:translateY(-16px);box-shadow:0 0 22px rgba(242,193,78,.85);border-color:#f2c14e}
.tube.hint{box-shadow:0 0 22px rgba(120,255,160,.95);border-color:#7dffa6}
.tube.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.1)}}
.tube i{display:block;height:var(--s);border-radius:7px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.28)}
nav{display:flex;gap:8px;padding:8px 0 4px}
.b{min-width:76px;min-height:64px;padding:8px 8px;font:inherit;font-size:26px;line-height:1;border:0;border-radius:16px;background:rgba(255,255,255,.16);color:#fff;cursor:pointer}
.b small{display:block;font-size:13px;margin-top:5px}
.b:disabled{opacity:.35}
.b:active:not(:disabled),.mb:active,.big:active{transform:scale(.97)}
h1{margin:14px 0 4px;font-size:38px}
.coins{font-size:24px;margin-bottom:12px;color:#f2c14e;font-weight:700}
#modes{width:100%;max-width:460px;display:flex;flex-direction:column;gap:10px}
.mb{font:inherit;color:#fff;border:0;border-radius:18px;padding:14px 18px;text-align:left;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.mb b{font-size:24px}.mb em{font-style:normal;font-size:18px;opacity:.9;grid-row:1}.mb span{font-size:16px;opacity:.9;grid-column:1/3}
.mb.c{background:#1f8a8f}.mb.t{background:#c98a00}.mb.m{background:#7b4fc9}.mb.h{background:#c43c3c}
.mrow{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;justify-content:center}
.dot{position:relative}.dot::after{content:"";position:absolute;top:6px;right:6px;width:14px;height:14px;border-radius:50%;background:#ff4d4d;border:2px solid #fff}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,20,32,.72);z-index:5}
#modal.on{display:flex}
.card{background:#fff;color:#12263a;border-radius:24px;padding:22px 22px;text-align:center;width:min(92vw,440px);max-height:92vh;overflow-y:auto}
.card h2{margin:0 0 6px;font-size:28px}
.card p{margin:0 0 14px;font-size:19px}
.big,.sm,.item{display:block;width:100%;font:inherit;border:0;border-radius:14px;cursor:pointer;margin:8px 0 0}
.big{font-size:21px;font-weight:700;padding:14px;background:#1f6f78;color:#fff}
.big.ad{background:#f2c14e;color:#12263a}
.sm{font-size:18px;padding:11px;background:#e6edf2;color:#12263a}
.item{font-size:18px;padding:12px 14px;background:#eef3f6;color:#12263a;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px}
.cell{border-radius:10px;background:#e6edf2;padding:6px 0;font-size:18px;font-weight:700}
.cell small{display:block;font-size:11px;font-weight:400}
.cell.got{background:#43a047;color:#fff}.cell.now{background:#f2c14e;outline:3px solid #12263a}
.row{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #dde5ea;font-size:18px;text-align:left}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tab{flex:1;font:inherit;font-size:15px;padding:9px 2px;border:0;border-radius:10px;background:#e6edf2;color:#12263a;cursor:pointer}.tab.on{background:#1f6f78;color:#fff}
.brand{display:flex;align-items:center;gap:10px;margin:2px 0 16px;font-size:20px;font-weight:700;opacity:.9}.brand svg{width:38px;height:38px}
#splash{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(90% 70% at 50% 35%,#16384a 0%,#0b1624 75%);transition:opacity .5s,visibility .5s}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
.slogo{width:104px;height:104px;filter:drop-shadow(0 16px 36px rgba(31,138,143,.4));animation:logoin .5s cubic-bezier(.2,.8,.2,1) both}
.slogo .d{animation:draw .5s ease-out both}
.sword{font-size:42px;font-weight:700;letter-spacing:.01em;animation:up .6s .85s both}
.strack{width:176px;height:4px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}
#sbar{height:100%;width:0;background:#f2c14e;border-radius:2px;transition:width .6s ease-out}
@keyframes draw{from{stroke-dasharray:1;stroke-dashoffset:1;opacity:0}to{stroke-dasharray:1;stroke-dashoffset:0;opacity:1}}
@keyframes logoin{from{transform:scale(.85);opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
#toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);background:#fff;color:#12263a;padding:12px 20px;border-radius:14px;font-size:18px;opacity:0;pointer-events:none;transition:opacity .25s;text-align:center;max-width:90vw;z-index:9}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

    t=[];for(let i=0;i<n;i++)t.push(pool.slice(i*CAP,i*CAP+CAP));

  let k=0;while(k<A.length&&A[A.length-1-k]===c)k++;

function shop(tab){
  if(tab)shopTab=tab;
  let h=`<h2>Магазин</h2><p>🪙 ${S.coins} · подсказок ${S.inv.hint} · пробирок ${S.inv.tube}</p><div class="tabs">`+Object.keys(TABN).map(k=>`<button class="tab${k===shopTab?' on':''}" onclick="shop('${k}')">${TABN[k]}</button>`).join('')+'</div>';
  SH[shopTab].forEach(([id,n,p])=>{
    const r=shopTab==='bonus'?p+' 🪙':(S.own.includes(id)?(S[KEY[shopTab]]===id?'✓ выбрано':'выбрать'):p+' 🪙');
    h+=`<button class="item" onclick="buy('${shopTab}','${id}')">${n}<b>${r}</b></button>`;
  });
  modal(h+`<button class="sm" onclick="closeModal()">Закрыть</button>`);
}
function buy(c,id){
  const p=SH[c].find(x=>x[0]===id)[2];
  if(c!=='bonus'&&S.own.includes(id)){S[KEY[c]]=id;SFX.ui()}
  else{
    if(S.coins<p){toast('Не хватает монет');SFX.bad();return}SFX.coin();
    S.coins-=p;
    if(c==='bonus'){const m=id.match(/(hint|tube)(\d+)/);S.inv[m[1]]+=+m[2]}else{S.own.push(id);S[KEY[c]]=id}
  }
  COLORS=PAL[S.pal]||PAL.def;skin();save();coinsUI();shop();
  if(!$('app').classList.contains('off'))render();
}

/* ---------- таблица лидеров ---------- */
function lb(){
  modal(`<h2>Лидеры</h2><p>Ваши очки: ★ ${S.score}</p><div id="lbl">Загрузка…</div><button class="sm" onclick="closeModal()">Закрыть</button>`);
  if(!ysdk){$('lbl').textContent='Таблица лидеров работает в игре на Яндекс Играх.';return}
  const show=(r,login)=>{$('lbl').innerHTML=(r.entries.map(e=>`<div class="row"><span data-nt>${e.rank}. ${esc(e.player.publicName||L('Игрок'))}</span><b>${e.score}</b></div>`).join('')||'Пока никого нет')+(login?'<button class="sm" onclick="login()">Войти, чтобы попасть в таблицу</button>':'')};
  ysdk.leaderboards.getEntries('score',{quantityTop:10,includeUser:true,quantityAround:2}).then(r=>show(r,false))
   .catch(()=>ysdk.leaderboards.getEntries('score',{quantityTop:10}).then(r=>show(r,true)).catch(()=>{$('lbl').textContent='Не удалось загрузить таблицу. Попробуйте позже.'}));
}
function login(){try{ysdk.auth.openAuthDialog().then(()=>{submit();lb()}).catch(()=>{})}catch(e){}}

/* ---------- заставка FxGame и старт ---------- */
const setP=v=>{$('sbar').style.width=(v*100)+'%'};
const splashDone=()=>new Promise(r=>{
  setTimeout(()=>{setP(1);setTimeout(()=>{const e=$('splash');e.classList.add('out');setTimeout(()=>e.remove(),600);r()},350)},Math.max(0,1700-performance.now()));
});
async function boot(){
  setTimeout(()=>setP(.3),80);
  if(window.YaGames){
    try{
      ysdk=await YaGames.init();setP(.6);
      try{const r=await ysdk.shortcut.canShowPrompt();canShortcut=!!(r&&r.canShow)}catch(e){}
      try{lang=pick(ysdk.environment.i18n.lang)}catch(e){}
      try{
        player=await ysdk.getPlayer({scopes:false});
        const d=await player.getData(['s']),c=d&&d.s;
        if(c&&(c.ts||0)>(S.ts||0)){Object.assign(S,c);COLORS=PAL[S.pal]||PAL.def}
      }catch(e){}
    }catch(e){}
  }
  setP(.85);
  ['lagoon','glass','def'].forEach(x=>{if(!S.own.includes(x))S.own.push(x)});
  if(!BG[S.bg])S.bg='lagoon';if(!TB[S.tb])S.tb='glass';if(!PAL[S.pal])S.pal='def';
  skin();i18n();menu();
  await splashDone();
  if(canClaim())calendar();
  try{ysdk&&ysdk.features.LoadingAPI&&ysdk.features.LoadingAPI.ready()}catch(e){}
  submit();
}
boot();
(function(){
  if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)return;
  let dip=null;const show=()=>{canShortcut=true;$('scut').classList.remove('off')};
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;show()});
  if(/iphone|ipad|ipod/i.test(navigator.userAgent))show();
  window.shortcut=()=>{
    if(dip){dip.prompt();dip.userChoice.finally(()=>{dip=null;canShortcut=false;$('scut').classList.add('off')})}
    else modal('<h2>Установка</h2><p>Нажмите кнопку «Поделиться» внизу экрана Safari, затем выберите «На экран Домой».</p><button class="sm" onclick="closeModal()">Понятно</button>');
  };
})();
if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
